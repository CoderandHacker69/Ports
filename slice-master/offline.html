<!doctype html>
<html>
<head>
    <!-- base will be set dynamically to prefer jsDelivr when online -->
    <script>
        (function(){
            // CDN-first: always use jsDelivr as the base so all relative assets load from CDN
            var cdnBase = 'https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/slice-master/';
            var baseEl = document.createElement('base');
            baseEl.href = cdnBase;
            document.head.appendChild(baseEl);

            // Helper to load scripts in sequence (CDN-first)
            function loadScripts(list, index){
                if(index>=list.length) return;
                var s = document.createElement('script');
                s.src = list[index];
                s.onload = function(){ loadScripts(list, index+1); };
                s.onerror = function(){ console.warn('Failed loading', list[index]); loadScripts(list, index+1); };
                document.head.appendChild(s);
            }

            // Always load jQuery from jsDelivr, then other assets via relative paths (resolved to CDN by base)
            loadScripts([
                'https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.min.js',
                'playcanvas-stable.min.js',
                'settings.js',
                'modules.js',
                'start.js',
                'loading.js'
            ], 0);
        })();
    </script>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover' />
    <meta charset='utf-8'>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <style></style>
    <title>Slice Master</title>
    <script>
        // Service worker: only attempt when on a secure origin or when loaded from the CDN host
        try {
            var hostname = location.hostname || '';
            var isSecure = (location.protocol === 'https:' || hostname === 'localhost' || hostname === '127.0.0.1' || hostname.indexOf('cdn.jsdelivr.net') !== -1);
            if ('serviceWorker' in navigator && isSecure) {
                navigator.serviceWorker.register('sw.js').then(function(reg){
                    console.log('Service worker registered:', reg.scope);
                }).catch(function(err){
                    console.log('Service worker registration failed:', err);
                });
            } else {
                console.log('Skipping service worker registration (insecure origin or file://).');
            }
        } catch (e) {
            console.log('Service worker registration error:', e);
        }

        // Resume AudioContext on first user gesture to avoid autoplay blocking
        (function attachAudioResume(){
            function resumeAudio(){
                try {
                    var ac = window.AudioContext || window.webkitAudioContext;
                    if (ac && window.__pc_audio_context && window.__pc_audio_context.state === 'suspended') {
                        window.__pc_audio_context.resume();
                    }
                } catch(e){}
                window.removeEventListener('click', resumeAudio);
                window.removeEventListener('keydown', resumeAudio);
            }
            window.addEventListener('click', resumeAudio, { once: true });
            window.addEventListener('keydown', resumeAudio, { once: true });
        })();
    </script>
</head>
<body>
    <!-- Modules and app scripts are loaded from the head loader to guarantee order -->
</body>
</html>
