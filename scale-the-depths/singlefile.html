<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Scale the Depths (Stable WebGL)</title>
<style>
body { margin:0; background:black; }
#unity-container { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" width="960" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("unity-canvas");
function log(...args){ console.log("[UNITY]", ...args); }

// --- Backup URLs for all Unity files ---
const FILES = {
  loader: [
    "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/PWA_Build_2.loader.js",
    "https://raw.githubusercontent.com/CoderandHacker69/Ports/main/scale-the-depths/Build/PWA_Build_2.loader.js",
    "https://another-backup.example.com/PWA_Build_2.loader.js"
  ],
  framework: [
    "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/PWA_Build_2.framework.js",
    "https://raw.githubusercontent.com/CoderandHacker69/Ports/main/scale-the-depths/Build/PWA_Build_2.framework.js",
    "https://another-backup.example.com/PWA_Build_2.framework.js"
  ],
  data: [
    "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/PWA_Build_2.data.br",
    "https://raw.githubusercontent.com/CoderandHacker69/Ports/main/scale-the-depths/Build/PWA_Build_2.data.br",
    "https://another-backup.example.com/PWA_Build_2.data.br"
  ],
  wasm: [
    "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/PWA_Build_2.wasm.br",
    "https://raw.githubusercontent.com/CoderandHacker69/Ports/main/scale-the-depths/Build/PWA_Build_2.wasm.br",
    "https://another-backup.example.com/PWA_Build_2.wasm.br"
  ]
};

// --- Load a JS script from backups ---
async function loadScriptBackup(urls){
  for(const url of urls){
    try{
      await new Promise((resolve,reject)=>{
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => { log("Loaded script:", url); resolve(); };
        s.onerror = () => { log("Failed to load script backup:", url); reject(); };
        document.body.appendChild(s);
      });
      return;
    }catch(e){}
  }
  throw new Error("All script backups failed: " + urls[0]);
}

// --- Pick first available file URL for loader config ---
async function fetchFirstAvailable(urls){
  for(const url of urls){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      log("Fetched file:", url);
      return url;
    }catch(e){ log("Failed to fetch file:", url, e.message); }
  }
  throw new Error("All backups failed: "+urls[0]);
}

// --- Start Unity ---
async function start(){
  try{
    // 1. Load loader first
    await loadScriptBackup(FILES.loader);
    if(typeof createUnityInstance!=="function") throw new Error("Unity loader not ready");
    log("Loader ready");

    // 2. Pick first available WASM, framework, data URLs
    const wasmUrl = await fetchFirstAvailable(FILES.wasm);
    const frameworkUrl = await fetchFirstAvailable(FILES.framework);
    const dataUrl = await fetchFirstAvailable(FILES.data);

    // 3. WASM streaming fallback
    WebAssembly.instantiateStreaming = async(respPromise, imports)=>{
      log("Using WASM fallback");
      const resp = await respPromise;
      const buffer = await resp.arrayBuffer();
      return WebAssembly.instantiate(buffer, imports);
    };

    // 4. Unity config
    const config = {
      codeUrl: wasmUrl,
      frameworkUrl,
      dataUrl,
      streamingAssetsUrl:"StreamingAssets",
      companyName:"Glass Gecko Games",
      productName:"Scale the Depths",
      productVersion:"1.0"
    };

    log("Starting Unity...");
    createUnityInstance(canvas, config, progress => log("Loading:", Math.round(progress*100)+"%"))
      .then(()=>log("Unity loaded successfully 🎉"))
      .catch(err=>{ console.error(err); alert("Unity crash: "+err.message); });

  }catch(e){
    console.error("FATAL:", e);
    alert("FAILED: "+e);
  }
}

start();
</script>
</body>
</html>
