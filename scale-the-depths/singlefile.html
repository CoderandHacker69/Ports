<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Scale the Depths (Brotli Hack)</title>

  <style>
    body { margin: 0; background: black; }
    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- ✅ WORKING Brotli (browser version) -->
  <script src="https://cdn.jsdelivr.net/npm/brotli@1.3.2/browser.js"></script>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600"></canvas>
  </div>

  <script>
    const BASE = "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/";
    const canvas = document.getElementById("unity-canvas");

    function log(...args) {
      console.log("[UNITY HACK]", ...args);
    }

    async function fetchFile(url) {
      log("Fetching:", url);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Fetch failed: " + url);
      return new Uint8Array(await res.arrayBuffer());
    }

    async function fetchAndDecompress(url) {
      const buffer = await fetchFile(url);

      try {
        log("Decompressing:", url);
        return window.brotli.decompress(buffer);
      } catch (e) {
        log("Decompression failed, using raw:", url);
        return buffer; // fallback
      }
    }

    function toBlobURL(buffer, type) {
      return URL.createObjectURL(new Blob([buffer], { type }));
    }

    async function loadUnityHack() {
      try {
        // ✅ Load Unity loader FIRST
        await new Promise((resolve) => {
          const s = document.createElement("script");
          s.src = BASE + "PWA Build 2.loader.js";
          s.onload = () => {
            log("Loader loaded");
            resolve();
          };
          s.onerror = () => {
            throw new Error("Failed to load loader.js");
          };
          document.body.appendChild(s);
        });

        if (typeof createUnityInstance !== "function") {
          throw new Error("createUnityInstance missing");
        }

        // ✅ Patch WASM streaming (REQUIRED)
        WebAssembly.instantiateStreaming = async (respPromise, imports) => {
          log("Using WASM fallback");
          const resp = await respPromise;
          const buffer = await resp.arrayBuffer();
          return WebAssembly.instantiate(buffer, imports);
        };

        // 🔹 Load files (with fallback)
        const jsData = await fetchAndDecompress(BASE + "PWA Build 2.framework.js.br");
        const wasmData = await fetchAndDecompress(BASE + "PWA Build 2.wasm.br");
        const dataData = await fetchAndDecompress(BASE + "PWA Build 2.data.br");

        // 🔹 Convert to URLs
        const jsUrl = toBlobURL(jsData, "application/javascript");
        const wasmUrl = toBlobURL(wasmData, "application/wasm");
        const dataUrl = toBlobURL(dataData, "application/octet-stream");

        log("Blob URLs created");

        // 🔹 Inject framework (backup if loader fails)
        await new Promise((resolve) => {
          const script = document.createElement("script");
          script.src = jsUrl;
          script.onload = () => {
            log("Framework loaded");
            resolve();
          };
          script.onerror = () => {
            log("Framework failed (continuing anyway)");
            resolve(); // fallback
          };
          document.body.appendChild(script);
        });

        // 🔹 Unity config
        const config = {
          dataUrl: dataUrl,
          codeUrl: wasmUrl,
          frameworkUrl: jsUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Glass Gecko Games",
          productName: "Scale the Depths",
          productVersion: "1.0",
        };

        log("Starting Unity...");

        createUnityInstance(canvas, config, (progress) => {
          log("Loading:", Math.round(progress * 100) + "%");
        }).then(() => {
          log("Unity loaded successfully 🎉");
        }).catch((err) => {
          console.error("Unity failed:", err);
          alert("Unity crash: " + err.message);
        });

      } catch (e) {
        console.error("FATAL:", e);
        alert("FAILED: " + e.message);
      }
    }

    loadUnityHack();
  </script>
</body>
</html>
