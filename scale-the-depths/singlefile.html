<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Scale the Depths (Split WASM, Framework JS)</title>
  <style>
    body { margin:0; background:black; }
    #unity-container { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600"></canvas>
  </div>

  <script>
    const BASE = "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/";
    const canvas = document.getElementById("unity-canvas");

    function log(...args){ console.log("[UNITY]", ...args); }

    async function fetchFile(url){
      log("Fetching:", url);
      const res = await fetch(url);
      if(!res.ok) throw new Error("Failed to fetch "+url);
      return new Uint8Array(await res.arrayBuffer());
    }

    function toBlobURL(buffer,type){ return URL.createObjectURL(new Blob([buffer],{type})); }

    // Merge split WASM
    async function buildWasm(){
      log("Fetching WASM parts...");
      const part1 = await fetchFile(BASE+"PWA Build 2.wasm.br.part1");
      const part2 = await fetchFile(BASE+"PWA Build 2.wasm.br.part2");
      const merged = new Uint8Array(part1.length+part2.length);
      merged.set(part1,0);
      merged.set(part2,part1.length);
      log("WASM merged");
      return toBlobURL(merged,"application/wasm");
    }

    async function start(){
      try{
        // Load Unity loader
        await new Promise((resolve,reject)=>{
          const s=document.createElement("script");
          s.src=BASE+"PWA_Build_2.loader.js";
          s.onload=resolve;
          s.onerror=()=>reject("Loader failed");
          document.body.appendChild(s);
        });

        if(typeof createUnityInstance!=="function") throw new Error("Unity loader not ready");
        log("Loader ready");

        const wasmUrl = await buildWasm();
        const frameworkUrl = BASE+"PWA_Build_2.framework.js"; // raw JS
        const dataUrl = BASE+"PWA Build 2.data.br"; // leave compressed

        // WASM streaming fallback
        WebAssembly.instantiateStreaming=async(respPromise,imports)=>{
          log("Using WASM fallback");
          const resp = await respPromise;
          const buffer = await resp.arrayBuffer();
          return WebAssembly.instantiate(buffer,imports);
        };

        const config = {
          dataUrl,
          frameworkUrl,
          codeUrl: wasmUrl,
          streamingAssetsUrl:"StreamingAssets",
          companyName:"Glass Gecko Games",
          productName:"Scale the Depths",
          productVersion:"1.0"
        };

        log("Starting Unity...");
        createUnityInstance(canvas,config,(progress)=>{ log("Loading:",Math.round(progress*100)+"%"); })
        .then(()=>log("Unity loaded successfully 🎉"))
        .catch(err=>{console.error(err);alert("Unity crash: "+err.message);});

      }catch(e){ console.error("FATAL:",e); alert("FAILED: "+e); }
    }

    start();
  </script>
</body>
</html>
