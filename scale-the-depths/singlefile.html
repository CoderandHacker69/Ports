<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Scale the Depths (Blob WASM Fix)</title>
<style>
body { margin:0; background:black; }
#unity-container {
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" width="960" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("unity-canvas");

function log(...args){ console.log("[UNITY]", ...args); }

// ✅ jsDelivr base
const BASE = "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/";

const FILES = {
  loader: BASE + "PWA_Build_2.loader.js",
  framework: BASE + "PWA_Build_2.framework.js",
  data: BASE + "PWA_Build_2.data",

  // 👇 SPLIT FILES
  wasm1: BASE + "PWA_Build_2.wasm.part1",
  wasm2: BASE + "PWA_Build_2.wasm.part2"
};

// Load script
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = reject;
    document.body.appendChild(s);
  });
}

// 🔥 Combine WASM parts into one Blob URL
async function buildWasmBlob(){
  log("Fetching WASM parts...");

  const [res1, res2] = await Promise.all([
    fetch(FILES.wasm1),
    fetch(FILES.wasm2)
  ]);

  if(!res1.ok || !res2.ok){
    throw new Error("Failed to fetch WASM parts");
  }

  const buf1 = await res1.arrayBuffer();
  const buf2 = await res2.arrayBuffer();

  log("Combining WASM...");

  const combined = new Uint8Array(buf1.byteLength + buf2.byteLength);
  combined.set(new Uint8Array(buf1), 0);
  combined.set(new Uint8Array(buf2), buf1.byteLength);

  const blob = new Blob([combined], { type: "application/wasm" });
  const blobUrl = URL.createObjectURL(blob);

  log("WASM Blob ready");
  return blobUrl;
}

async function start(){
  try{
    log("Loading loader...");
    await loadScript(FILES.loader);

    if(typeof createUnityInstance !== "function"){
      throw new Error("Unity loader failed");
    }

    // 🔥 Build WASM from parts
    const wasmBlobUrl = await buildWasmBlob();

    log("Starting Unity...");

    const config = {
      dataUrl: FILES.data,
      frameworkUrl: FILES.framework,
      codeUrl: wasmBlobUrl,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Glass Gecko Games",
      productName: "Scale the Depths",
      productVersion: "1.0"
    };

    createUnityInstance(canvas, config, (progress)=>{
      log("Loading:", Math.round(progress * 100) + "%");
    })
    .then(()=>{
      log("✅ Unity loaded");
    })
    .catch((err)=>{
      console.error(err);
      alert("Unity crash: " + err);
    });

  }catch(e){
    console.error(e);
    alert("FAILED: " + e);
  }
}

start();
</script>
</body>
</html>
