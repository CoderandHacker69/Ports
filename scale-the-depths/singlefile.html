<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Scale the Depths (aa/ab split)</title>
<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}
#unity-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  background: black;
}
</style>
</head>
<body>

<div id="unity-container">
  <canvas id="unity-canvas" width="960" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("unity-canvas");

function log(...args){
  console.log("[UNITY]", ...args);
}

// ✅ jsDelivr base
const BASE = "https://cdn.jsdelivr.net/gh/CoderandHacker69/Ports/scale-the-depths/Build/";

// ✅ FILES (NO .br)
const FILES = {
  loader: BASE + "PWA_Build_2.loader.js",
  framework: BASE + "PWA_Build_2.framework.js",
  data: BASE + "PWA_Build_2.data",

  // 🔥 EXACT FILENAMES YOU HAVE
  wasmParts: [
    BASE + "PWA_Build_2.wasm.partaa",
    BASE + "PWA_Build_2.wasm.partab"
  ]
};

// Load script
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => {
      log("Loaded:", url);
      resolve();
    };
    s.onerror = () => reject("Failed to load " + url);
    document.body.appendChild(s);
  });
}

// 🔥 Combine .partaa + .partab into valid WASM
async function buildWasmBlob(){
  log("Fetching WASM parts...");

  const responses = await Promise.all(
    FILES.wasmParts.map(url => fetch(url))
  );

  responses.forEach((r, i)=>{
    if(!r.ok){
      throw new Error("Failed to fetch part " + i);
    }
  });

  const buffers = await Promise.all(
    responses.map(r => r.arrayBuffer())
  );

  const totalSize = buffers.reduce((sum, b) => sum + b.byteLength, 0);
  const combined = new Uint8Array(totalSize);

  let offset = 0;
  for(const buf of buffers){
    combined.set(new Uint8Array(buf), offset);
    offset += buf.byteLength;
  }

  log("WASM combined:", totalSize, "bytes");

  return URL.createObjectURL(
    new Blob([combined], { type: "application/wasm" })
  );
}

// 🚀 Start Unity
async function start(){
  try{
    log("Loading loader...");
    await loadScript(FILES.loader);

    if(typeof createUnityInstance !== "function"){
      throw new Error("Unity loader failed");
    }

    const wasmURL = await buildWasmBlob();

    log("Starting Unity...");

    const config = {
      dataUrl: FILES.data,
      frameworkUrl: FILES.framework,
      codeUrl: wasmURL,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Glass Gecko Games",
      productName: "Scale the Depths",
      productVersion: "1.0"
    };

    createUnityInstance(canvas, config, (progress)=>{
      log("Loading:", Math.round(progress * 100) + "%");
    })
    .then(()=>{
      log("✅ Unity loaded successfully");
    })
    .catch(err=>{
      console.error(err);
      alert("Unity crash: " + err);
    });

  }catch(e){
    console.error(e);
    alert("FATAL: " + e);
  }
}

start();
</script>

</body>
</html>
